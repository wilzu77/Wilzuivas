<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zupy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1a1f2b;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid #2a3140;
        }
        .card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #f0f4fa;
        }
        .card p {
            color: #9aa4b8;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
            color: #d0d8e3;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #2a3140;
            border-radius: 12px;
            font-size: 15px;
            background: #0f141c;
            color: #e8edf5;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #00A651;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,166,81,0.15);
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00A651, #008a44);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,166,81,0.35);
        }
        .error {
            background: #2d1b1b;
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            border: 1px solid #4b2a2a;
            display: none;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #9aa4b8;
        }
        .footer a {
            color: #00A651;
            font-weight: 600;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Masuk</h2>
        <p>Masuk ke akun Anda.</p>
        <div id="errorMsg" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="contoh@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
        <div class="footer">
            Belum punya akun? <a href="/register.html">Daftar sekarang</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.message || 'Login gagal.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Terjadi kesalahan server.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
